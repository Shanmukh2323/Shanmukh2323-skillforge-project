<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - Admin | SkillForge</title>

    <link rel="stylesheet" href="admin_dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ADD COURSE PAGE STYLES */
        .section-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .form-card {
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #d7d9df;
            font-size: 15px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #1abd9c;
            color: white;
        }

        .btn-danger {
            background: #ff5c5c;
            color: white;
        }

        .course-table {
            width: 100%;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: var(--topbar-bg);
            color: white;
            padding: 14px;
            font-size: 15px;
        }

        table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e2e2;
            color: var(--text);
        }

        .delete-btn {
            padding: 8px 14px;
            border-radius: 8px;
            background: #ff4a4a;
            color: white;
            cursor: pointer;
            border: none;
        }
    </style>
</head>

<body>

<script>
// Only admin can access
if (!localStorage.getItem("token") || localStorage.getItem("role") !== "admin") {
    alert("Access Denied");
    window.location.href = "login.html";
}
</script>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2 class="logo">SkillForge</h2>

        <nav class="menu">
            <a href="admin_dashboard.html">🏠 Dashboard</a>

            <p class="menu-title">User Management</p>
            <a href="#">👥 All Users</a>
            <a href="#">👤 Students</a>
            <a href="#">👨‍🏫 Instructors</a>

            <p class="menu-title">Course Management</p>
            <a href="manage_courses.html">📚 All Courses</a>
            <a href="add_course.html" class="active">➕ Add Course</a>

            <p class="menu-title">System</p>
            <a href="#">⚙️ Settings</a>
            <a href="#" class="logout" onclick="logout()">🚪 Logout</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <h2 class="welcome">Add New Course ➕</h2>

            <div class="top-right">
                <input type="text" class="search" placeholder="Search...">
                <span class="icon-btn">🔔</span>
                <span class="icon-btn">✉️</span>
                <span class="icon-btn" id="themeToggle">🌗</span>
                <div class="profile">A</div>
            </div>
        </header>

        <!-- ADD COURSE FORM -->
        <div class="form-card">
            <h2 class="section-title">Create a Course</h2>

            <form id="courseForm">

                <input type="text" id="title" placeholder="Course Title" required>

                <textarea id="description" placeholder="Course Description" rows="4" required></textarea>

                <input type="number" id="instructor_id" placeholder="Instructor ID" required>

                <input type="text" id="category" placeholder="Category (e.g., Python, AI, Java)" required>

                <select id="level" required>
                    <option value="">Select Difficulty Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>

                <input type="text" id="image" placeholder="Course Image URL">

                <button class="btn btn-primary" type="submit">Add Course</button>
            </form>
        </div>

        <!-- DELETE COURSE LIST -->
        <h2 class="section-title">Delete Courses</h2>

        <div class="course-table">
            <table id="courseTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Course Title</th>
                        <th>Instructor</th>
                        <th>Category</th>
                        <th>Level</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS Loads Courses Here -->
                </tbody>
            </table>
        </div>

    </main>
</div>

<script>
// THEME TOGGLE
document.getElementById("themeToggle").addEventListener("click", () => {
    const mode = document.documentElement.getAttribute("data-theme");
    if (mode === "dark") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", "dark");
});

// LOGOUT
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

// ADD COURSE API
document.getElementById("courseForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const payload = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        instructor_id: document.getElementById("instructor_id").value,
        category: document.getElementById("category").value,
        level: document.getElementById("level").value,
        image: document.getElementById("image").value
    };

    const res = await fetch("http://localhost:8080/admin/add-course", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token"),
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);

    loadCourses(); // refresh table
});

// LOAD COURSE TABLE
async function loadCourses() {
    const res = await fetch("http://localhost:8080/admin/courses", {
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
        }
    });

    const courses = await res.json();
    const tbody = document.querySelector("#courseTable tbody");
    tbody.innerHTML = "";

    courses.forEach(course => {
        tbody.innerHTML += `
            <tr>
                <td>${course.id}</td>
                <td>${course.title}</td>
                <td>${course.instructor_id}</td>
                <td>${course.category}</td>
                <td>${course.level}</td>
                <td>
                    <button class="delete-btn" onclick="deleteCourse(${course.id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

// DELETE COURSE API
async function deleteCourse(id) {
    if (!confirm("Are you sure you want to delete this course?")) return;

    const res = await fetch(`http://localhost:8080/admin/delete-course/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
        }
    });

    const data = await res.json();
    alert(data.message);

    loadCourses();
}

loadCourses();
</script>

</body>
</html>
