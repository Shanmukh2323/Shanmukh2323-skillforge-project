<!DOCTYPE html>
<html>
<head>
    <title>My Progress</title>
    <link rel="stylesheet" href="student_progress.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="progress-container">

    <h2 class="page-title">📊 My Learning Progress</h2>

    <!-- ===== STATS CARDS ===== -->
    <div class="cards">
        <div class="card">
            <h3>Total Assignments</h3>
            <span id="total">0</span>
        </div>

        <div class="card">
            <h3>Submitted</h3>
            <span id="submitted">0</span>
        </div>

        <div class="card">
            <h3>🏆 Rank</h3>
            <span id="rank">--</span>
        </div>


        <div class="card">
            <h3>Average Score</h3>
            <span id="average">0</span>%
        </div>

        <div class="card">
            <h3>Best Score</h3>
            <span id="best">0</span>%
        </div>
    </div>

    <!-- ===== BAR CHART ===== -->
    <div class="chart-box">
        <h3>📊 Assignment Scores</h3>
        <canvas id="scoreChart" height="120"></canvas>
    </div>

    <!-- ===== LINE CHART ===== -->
    <div class="chart-box" style="margin-top:30px">
        <h3>📈 Progress Over Time</h3>
        <canvas id="lineChart" height="120"></canvas>
    </div>

    <!-- ===== PIE CHART ===== -->
    <div class="chart-box pie-box">
    <h3>🥧 Pass vs Fail</h3>

    <div class="pie-wrapper">
        <canvas id="passFailChart"></canvas>
    </div>
</div>



    <!-- ===== ACTIONS ===== -->
    <div style="margin-top:30px; text-align:center">
        <button id="downloadBtn">📄 Download Progress Report</button>
    </div>

</div>

<script src="student_progress.js"></script>
</body>
</html>
