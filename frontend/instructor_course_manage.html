<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Course - SkillForge</title>
    <link rel="stylesheet" href="instructor_course_manage.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<script>
/* ================= AUTH + COURSE CHECK ================= */
if (!localStorage.getItem("token") || localStorage.getItem("role") !== "instructor") {
    window.location.href = "login.html";
}

const token = localStorage.getItem("token");
const courseId = localStorage.getItem("selectedCourse");

if (!courseId) {
    alert("No course selected!");
    window.location.href = "instructor_courses.html";
}
</script>

<div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <h2 class="logo">SkillForge</h2>
        <nav class="menu">
            <a href="instructor_dashboard.html">🏠 Dashboard</a>
            <a href="instructor_courses.html" class="active">📚 My Courses</a>
            <a href="add_course_instructor.html">➕ Add Course</a>
            <a href="instructor_assignments.html">📝 Assignments</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </nav>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <h2 id="courseTitle">Course</h2>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('studentsTab')">👥 Students</button>
            <button class="tab-btn" onclick="showTab('videosTab')">🎥 Videos</button>
            <button class="tab-btn" onclick="showTab('assignmentsTab')">📝 Assignments</button>
            <button class="tab-btn" onclick="showTab('analyticsTab')">📊 Analytics</button>
        </div>

        <!-- ================= STUDENTS TAB ================= -->
        <section id="studentsTab" class="tab-section active">
            <h3>Enrolled Students</h3>
            <button class="add-btn" onclick="openStudentPopup()">➕ Add Student</button>
            <div id="studentList" class="list"></div>
        </section>

        <!-- ================= VIDEOS TAB ================= -->
        <section id="videosTab" class="tab-section">
            <h3>🎥 Course Videos</h3>

            <div class="video-form">
                <input id="videoTitle" placeholder="Video Title">
                <input id="videoURL" placeholder="YouTube Video URL">
                <input id="videoDuration" placeholder="Duration (eg: 10:30)">
                <button class="add-btn" onclick="addVideo()">➕ Add Video</button>
            </div>

            <div id="videoList" class="list"></div>
        </section>

        <!-- ================= ASSIGNMENTS TAB ================= -->
        <section id="assignmentsTab" class="tab-section">
            <h3>Assignments</h3>
            <p>Use the Assignments page to create & manage assignments.</p>
        </section>

        <!-- ================= ANALYTICS TAB ================= -->
        <section id="analyticsTab" class="tab-section">
            <h3>Analytics</h3>
            <p>AI insights & progress (coming soon).</p>
        </section>

    </main>
</div>

<!-- ================= ADD STUDENT POPUP ================= -->
<div id="studentPopup" class="popup">
    <div class="popup-box">
        <h3>Add Student</h3>
        <input id="studentName" placeholder="Student Name">
        <input id="studentEmail" placeholder="Student Email">
        <button onclick="addStudent()">Add</button>
        <button class="close-btn" onclick="closeStudentPopup()">Cancel</button>
    </div>
</div>

<script>
/* ================= TAB SWITCH ================= */
function showTab(tabId) {
    document.querySelectorAll(".tab-section").forEach(s =>
        s.classList.remove("active")
    );
    document.querySelectorAll(".tab-btn").forEach(b =>
        b.classList.remove("active")
    );

    document.getElementById(tabId).classList.add("active");
    event.target.classList.add("active");
}

/* ================= LOGOUT ================= */
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

/* ================= YOUTUBE EMBED FIX ================= */
function toEmbedURL(url) {
    if (!url) return "";

    if (url.includes("embed")) return url;

    if (url.includes("youtu.be")) {
        return "https://www.youtube.com/embed/" +
               url.split("youtu.be/")[1].split("?")[0];
    }

    if (url.includes("youtube.com/watch")) {
        return "https://www.youtube.com/embed/" +
               new URL(url).searchParams.get("v");
    }

    return url;
}

/* ================= LOAD COURSE TITLE ================= */
async function loadCourse() {
    const res = await fetch("http://localhost:8080/instructor/courses", {
        headers: { Authorization: `Bearer ${token}` }
    });
    const courses = await res.json();
    const course = courses.find(c => c.id == courseId);
    document.getElementById("courseTitle").innerText = course.title;
}

/* ================= STUDENTS ================= */
async function loadStudents() {
    const res = await fetch(`http://localhost:8080/instructor/course/${courseId}/students`, {
        headers: { Authorization: `Bearer ${token}` }
    });
    const students = await res.json();

    const list = document.getElementById("studentList");
    list.innerHTML = "";

    students.forEach(s => {
        list.innerHTML += `
            <div class="item">
                <strong>${s.name}</strong>
                <p>${s.email}</p>
            </div>
        `;
    });
}

function openStudentPopup() {
    document.getElementById("studentPopup").style.display = "flex";
}
function closeStudentPopup() {
    document.getElementById("studentPopup").style.display = "none";
}

async function addStudent() {
    const name = document.getElementById("studentName").value;
    const email = document.getElementById("studentEmail").value;

    const res = await fetch(`http://localhost:8080/instructor/course/${courseId}/add-student`, {
        method: "POST",
        headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email })
    });

    const data = await res.json();
    alert(data.message);
    closeStudentPopup();
    loadStudents();
}

/* ================= VIDEOS ================= */
async function loadVideos() {
    const res = await fetch(`http://localhost:8080/instructor/course/${courseId}/videos`, {
        headers: { Authorization: `Bearer ${token}` }
    });
    const videos = await res.json();

    const list = document.getElementById("videoList");
    list.innerHTML = "";

    videos.forEach(v => {
        list.innerHTML += `
            <div class="item">
                <strong>${v.title}</strong>
                <p>Duration: ${v.duration || "N/A"}</p>
                <iframe
                    width="100%"
                    height="200"
                    src="${toEmbedURL(v.video_url)}"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        `;
    });
}

async function addVideo() {
    const title = document.getElementById("videoTitle").value;
    const url = document.getElementById("videoURL").value;
    const duration = document.getElementById("videoDuration").value;

    const res = await fetch(`http://localhost:8080/instructor/course/${courseId}/videos/add`, {
        method: "POST",
        headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ title, video_url: url, duration })
    });

    const data = await res.json();
    alert(data.message);

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoURL").value = "";
    document.getElementById("videoDuration").value = "";

    loadVideos();
}

/* ================= INIT ================= */
loadCourse();
loadStudents();
loadVideos();
</script>

</body>
</html>
